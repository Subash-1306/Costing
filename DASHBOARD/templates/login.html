<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Unitech Dashboard</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="theme-color" content="#0f1c3d">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="login-title">🏭 Unitech dashboard</div>
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Password
      <input type="password" name="password" autofocus autocomplete="current-password" required>
    </label>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <button type="submit" class="run-btn">Sign in</button>
  </form>
</body>
</html>
